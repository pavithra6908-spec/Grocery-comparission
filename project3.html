<!DOCTYPE html>
<html>

<head>
    <title>Jitan Shop</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

                #homePage {
            background-color: lightpink;
            min-height: 100vh;
        }

        .nav-bar {
            display: flex;
            width: 100%;
        }

        .nav-title {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .products {
            width: 100%;
            text-align: center;
        }

        th,
        td {
            padding: 10px 20px;
            text-align: center;
        }

        .products img {
            width: 200px;
            height: 150px;
            object-fit: cover;
            cursor: pointer;
            border-radius: 10px;
        }

        .products img:hover {
            transform: scale(1.05);
        }


        #pricePage {
            display: none;
            background-color: lightblue;
            min-height: 100vh;
            padding: 20px;
        }

        #pricePage h1 {
            color: red;
            text-align: center;
        }

        .price-box {
            text-align: center;
            margin-top: 30px;
        }

        input {
            padding: 10px;
            font-size: 16px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            margin: 10px;
        }

        #answer {
            color: darkblue;
        }
    </style>
</head>

<body>

    
    <div id="homePage">

        <div class="nav-bar">

            <img src="logo.jpg"
                 alt="Jitan Shop Logo"
                 width="150"
                 height="100">

            <div class="nav-title">
                <h1>~ JITAN SHOP ~</h1>
            </div>

        </div>

        <hr>

        <table class="products">

            <tr>
                <th>Dairy Products</th>
                <th>Fresh Vegetables</th>
                <th>Fresh Fruits</th>
                <th>Dhals & Rice</th>
                <th>Oils & Ghee</th>
                <th>Snacks</th>
                <th>Spices</th>
            </tr>

            <tr>

                               <th>
                    <img src="dairy.jpg"
                         alt="Dairy Products"
                         onclick="showPricePage('Dairy Products')">
                </th>

                
                <th>
                    <img src="vegetables.jpg"
                         alt="Fresh Vegetables"
                         onclick="showPricePage('Fresh Vegetables')">
                </th>

               
                <th>
                    <img src="fruits.jpg"
                         alt="Fresh Fruits"
                         onclick="showPricePage('Fresh Fruits')">
                </th>

                                <th>
                    <img src="dhalsandrice.jpg"
                         alt="Dhals and Rice"
                         onclick="showPricePage('Dhals & Rice')">
                </th>

                
                <th>
                    <img src="oils&ghee.jpg"
                         alt="Oils and Ghee"
                         onclick="showPricePage('Oils & Ghee')">
                </th>

                                <th>
                    <img src="snacks.jpg"
                         alt="Snacks"
                         onclick="showPricePage('Snacks')">
                </th>

                                <th>
                    <img src="spices.jpg"
                         alt="Spices"
                         onclick="showPricePage('Spices')">
                </th>

            </tr>

        </table>

    </div>


        <div id="pricePage">

        <h1>Grocery Price Comparison</h1>

        <hr>

        <div class="price-box">

            <p>Item Name:</p>

            <input type="text" id="item">

            <p>Price in Store 1:</p>

            <input type="number" id="price1">

            <p>Price in Store 2:</p>

            <input type="number" id="price2">

            <br><br>

            <button onclick="compare()">
                Compare Price
            </button>

            <button onclick="goBack()">
                Back
            </button>

            <h2 id="answer"></h2>

        </div>

    </div>


       <script>

        function showPricePage(category) {

            // First page hide
            document.getElementById("homePage").style.display = "none";

            // Price page show
            document.getElementById("pricePage").style.display = "block";

            // Click செய்த category name automatically வரும்
            document.getElementById("item").value = category;
        }


        function compare() {

            var item = document.getElementById("item").value;

            var price1 =
                Number(document.getElementById("price1").value);

            var price2 =
                Number(document.getElementById("price2").value);


            if (item == "" || price1 == "" || price2 == "") {

                document.getElementById("answer").innerHTML =
                    "Please enter all details.";

            }

            else if (price1 < price2) {

                document.getElementById("answer").innerHTML =
                    item + " is cheaper in Store 1";

            }

            else if (price2 < price1) {

                document.getElementById("answer").innerHTML =
                    item + " is cheaper in Store 2";

            }

            else {

                document.getElementById("answer").innerHTML =
                    "Both stores have the same price.";

            }

        }


        function goBack() {

            // Price page hide
            document.getElementById("pricePage").style.display = "none";

            // First page show
            document.getElementById("homePage").style.display = "block";

        }

    </script>

</body>

</html>
